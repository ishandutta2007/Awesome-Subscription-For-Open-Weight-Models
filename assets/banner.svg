<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .text-grad {
        fill: url(#primary-grad);
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #CBD5E1;
      }

      /* Dynamic Animations */
      @keyframes float-orb-1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(45px, 25px) scale(1.12); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes float-orb-2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, -20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.25; stroke-width: 1px; }
        50% { opacity: 0.65; stroke-width: 1.8px; }
      }
      @keyframes stream-flow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.8)); }
      }

      .orb-1 {
        animation: float-orb-1 9s ease-in-out infinite;
      }
      .orb-2 {
        animation: float-orb-2 11s ease-in-out infinite;
      }
      .pulse-line {
        animation: pulse-ring 4s ease-in-out infinite;
      }
      .streaming-path {
        stroke-dasharray: 20 15;
        animation: stream-flow 12s linear infinite;
      }
      .active-badge {
        animation: badge-pulse 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Animated Elements (Strictly Behind Text Layer) -->
  <g id="background-effects">
    <!-- Grid overlay with low opacity -->
    <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.8">
      <line x1="0" y1="60" x2="1200" y2="60" />
      <line x1="0" y1="120" x2="1200" y2="120" />
      <line x1="0" y1="180" x2="1200" y2="180" />
      <line x1="0" y1="240" x2="1200" y2="240" />
      <line x1="0" y1="300" x2="1200" y2="300" />
      <line x1="150" y1="0" x2="150" y2="360" />
      <line x1="300" y1="0" x2="300" y2="360" />
      <line x1="450" y1="0" x2="450" y2="360" />
      <line x1="600" y1="0" x2="600" y2="360" />
      <line x1="750" y1="0" x2="750" y2="360" />
      <line x1="900" y1="0" x2="900" y2="360" />
      <line x1="1050" y1="0" x2="1050" y2="360" />
    </g>

    <!-- Glowing Background Orbs (Blurry, ambient, won't obscure foreground) -->
    <circle class="orb-1" cx="180" cy="100" r="140" fill="#0284C7" opacity="0.16" filter="url(#soft-glow)" />
    <circle class="orb-2" cx="1020" cy="240" r="160" fill="#7C3AED" opacity="0.18" filter="url(#soft-glow)" />
    <circle class="orb-1" cx="620" cy="320" r="110" fill="#0D9488" opacity="0.12" filter="url(#soft-glow)" />

    <!-- Animated Data Stream Curves in the Background Margins -->
    <path class="streaming-path pulse-line" d="M -50 280 Q 250 340 550 260 T 1250 310" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.35" />
    <path class="streaming-path pulse-line" d="M -50 80 Q 350 20 700 90 T 1250 50" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.25" />
  </g>

  <!-- Foreground Content Layer (High contrast, clearly visible) -->
  <g id="foreground" filter="url(#text-shadow)">
    <!-- Top Category Pill / Tag -->
    <g class="active-badge" transform="translate(60, 42)">
      <rect width="365" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38BDF8" />
      <text x="32" y="18.5" fill="#38BDF8" class="badge-text">CURATED OPEN-WEIGHT ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="122" class="text-title">
      Awesome <tspan class="text-grad">Subscriptions</tspan>
    </text>
    <text x="60" y="172" class="text-title">
      For Open-Weight Models
    </text>

    <!-- Subtitle -->
    <text x="60" y="215" class="text-subtitle">
      Flat-Rate SaaS Access, High-Throughput Inference &amp; Open-Source Stacks for Agentic Coding
    </text>

    <!-- Feature Cards & Model Badges at the Bottom (Strictly separated from title) -->
    <g transform="translate(60, 252)">
      <!-- Card 1: Flat-Rate SaaS -->
      <g transform="translate(0, 0)">
        <rect width="245" height="58" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="25" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="13">⚡ FLAT-RATE SAAS ACCESS</text>
        <text x="16" y="44" class="pill-text" font-size="12">ClinePass • OpenCode • DevPass</text>
      </g>

      <!-- Card 2: Coding Agents -->
      <g transform="translate(260, 0)">
        <rect width="250" height="58" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="25" fill="#818CF8" font-family="sans-serif" font-weight="700" font-size="13">🤖 AGENTIC CODING MODELS</text>
        <text x="16" y="44" class="pill-text" font-size="12">GLM-5.3 • Qwen3.8 • DeepSeek V4</text>
      </g>

      <!-- Card 3: Self-Hosted Inference -->
      <g transform="translate(525, 0)">
        <rect width="255" height="58" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="25" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="13">🚀 HIGH-PERF SERVING</text>
        <text x="16" y="44" class="pill-text" font-size="12">vLLM • SGLang • Ollama • llama.cpp</text>
      </g>

      <!-- Card 4: Open Infrastructure -->
      <g transform="translate(795, 0)">
        <rect width="285" height="58" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="25" fill="#F472B6" font-family="sans-serif" font-weight="700" font-size="13">🌐 ZERO VENDOR LOCK-IN</text>
        <text x="16" y="44" class="pill-text" font-size="12">2–5× Usage Value • Full API Control</text>
      </g>
    </g>
  </g>

  <!-- Outer Border Glow -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#334155" stroke-width="1" />
</svg>

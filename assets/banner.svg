<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080C16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".8"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="100%" stop-color="#EC4899" stop-opacity="0"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".75"/><stop offset="100%" stop-color="#0F172A" stop-opacity=".85"/></linearGradient><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="text-shadow"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".9" stdDeviation="4"/></filter><style>@keyframes float-orb-1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,25px) scale(1.12)}}@keyframes float-orb-2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-20px) scale(.9)}}@keyframes pulse-ring{0%{opacity:.25;stroke-width:1px}50%{opacity:.65;stroke-width:1.8px}}@keyframes stream-flow{0%{stroke-dashoffset:400}}@keyframes badge-pulse{0%{opacity:.85;filter:drop-shadow(0 0 4px rgba(56,189,248,.4))}50%{opacity:1;filter:drop-shadow(0 0 12px rgba(129,140,248,.8))}}.text-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.